name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit curl
      - name: Cache libtensorflow
        uses: actions/cache@v4
        with:
          path: third_party/libtensorflow
          key: libtensorflow-2.18.0-cpu-linux-x86_64
      - name: Fetch libtensorflow
        run: ./scripts/fetch_libtensorflow.sh
      - name: Run tests
        run: ./scripts/test.sh

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit luarocks lua5.1 liblua5.1-0-dev
      - name: Install and load rock
        run: |
          TREE="$PWD/dist/rock"
          luarocks --lua-version=5.1 make --tree="$TREE" --deps-mode=none tensorflow-lua-scm-1.rockspec
          eval "$(luarocks --lua-version=5.1 path --tree="$TREE" --bin)"
          luajit -e 'local tf = require("tensorflow"); assert(tf.VERSION == "0.3.0"); assert(tf.Sequential); assert(tf.data.Dataset)'
